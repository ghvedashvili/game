<style>
  html,body{margin:0;height:100%;background:#050a16;overflow:hidden;font-family:'Noto Sans Georgian',system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;aspect-ratio:420/720;width:min(100vw,calc(100vh*0.5833));width:min(100vw,calc(100dvh*0.5833));overflow:hidden;background:#070d1f}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
  #hud{position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(5,12,28,.72);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:7px 10px;backdrop-filter:blur(4px);pointer-events:none}
  .team{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
  .team.r{align-items:flex-end}
  .nm{font-size:12px;font-weight:700;opacity:.75;display:flex;align-items:center;gap:5px}
  .team.on .nm{opacity:1;color:#facc15}
  .kit{width:9px;height:9px;border-radius:3px;display:inline-block}
  .dots{display:flex;gap:3px;flex-wrap:wrap}
  .team.r .dots{justify-content:flex-end}
  .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18);font-size:9px;line-height:12px;text-align:center;font-weight:900}
  .dot.g{background:#22c55e}.dot.m{background:#ef4444}
  .mid{text-align:center}
  .score{font-size:26px;font-weight:900;letter-spacing:1px;line-height:1}
  .sd{font-size:9px;color:#facc15;font-weight:700;white-space:nowrap;margin-top:2px;min-height:11px}
  #hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .25s}
  #mute{position:absolute;right:10px;bottom:72px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:17px;cursor:pointer}
  #banner{position:absolute;left:0;right:0;top:19%;text-align:center;font-size:46px;font-weight:900;pointer-events:none;opacity:0;text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.6)}
  #banner.show{animation:pop 2.1s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.12)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(5,15,35,.72),rgba(0,0,0,.88));transition:opacity .3s}
  .ov.hide{opacity:0;pointer-events:none}
  .ov h1{font-size:34px;margin:0 0 6px;font-weight:900;line-height:1.15;text-shadow:0 4px 18px rgba(250,204,21,.35)}
  .ov .big{font-size:58px;margin-bottom:4px}
  .ov.top{justify-content:flex-start;padding:16px 12px 0;overflow-y:auto}
  .ov.top>*{flex-shrink:0}
  .ov h2{font-size:22px;margin:4px 0 2px;font-weight:900}
  .sub{font-size:13px;opacity:.75;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px;padding-bottom:20px}
  .tbtn{font-family:inherit;display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:left}
  .tbtn:active{transform:scale(.97)}.tbtn:disabled{opacity:.45}
  .jer{width:22px;height:22px;border-radius:6px;flex:none;box-shadow:inset 0 -7px 0 var(--c2),0 0 0 1px rgba(255,255,255,.25)}
  .tree{display:flex;gap:8px;overflow-x:auto;width:100%;padding:4px 2px 150px;scroll-behavior:smooth}
  .col{display:flex;flex-direction:column;min-width:124px;flex:none}
  .colh{font-size:11px;font-weight:900;opacity:.7;text-align:center;margin-bottom:6px;white-space:nowrap}
  .colb{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:6px;min-height:430px}
  .mb{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:4px 7px;font-size:11.5px}
  .mb.nx{border-color:#facc15;box-shadow:0 0 0 1px #facc15}
  .tm{display:flex;align-items:center;gap:5px;line-height:1.55}.tm .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm .sc{font-weight:900;min-width:12px;text-align:right}.tm.l{opacity:.45}.tm.me .n{color:#facc15}.tm.w{font-weight:900}
  .tm .j{width:9px;height:9px;border-radius:3px;flex:none;box-shadow:inset 0 -3px 0 var(--c2)}
  .act{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.92) 30%);display:flex;flex-direction:column;align-items:center;gap:8px}
  .act .lbl{font-size:13px;font-weight:700;text-align:center}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn2{font-family:inherit;font-size:14px;font-weight:800;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:10px 16px;cursor:pointer}
  .btn.sm{font-size:15px;padding:11px 24px}
  #skip{position:absolute;left:10px;bottom:72px;display:none}
  .medh{font-weight:900;font-size:14px;margin:6px 0}.medt{border-collapse:collapse;font-size:13px;margin:0 auto}.medt td,.medt th{padding:4px 8px;text-align:center}.medt td:nth-child(2){text-align:left;white-space:nowrap}.medt .j{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px;box-shadow:inset 0 -3px 0 var(--c2)}.medt tr+tr td{border-top:1px solid rgba(255,255,255,.08)}
  .mode{opacity:.55}.mode.on{opacity:1;background:rgba(250,204,21,.25);border-color:#facc15}
  .ov p{font-size:14px;line-height:1.55;opacity:.85;max-width:300px;margin:8px 0 18px}
  .ov .fs{font-size:44px;font-weight:900;margin:4px 0 10px}
  .btn{font-family:inherit;font-size:18px;font-weight:900;color:#1a1300;background:linear-gradient(#fde047,#f59e0b);border:none;border-radius:999px;padding:14px 38px;cursor:pointer;box-shadow:0 6px 0 #a16207,0 10px 24px rgba(0,0,0,.4)}
  .btn:disabled{filter:grayscale(1);opacity:.6}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #a16207}
  .stats{font-size:12px;opacity:.6;margin-top:18px;min-height:14px}
</style>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';

const $=id=>document.getElementById(id);
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const Q=()=>new THREE.Quaternion();
const AX=V(1,0,0),AY=V(0,1,0),AZ=V(0,0,1);
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=t=>t*t*(3-2*t);
const EASE={io:smooth,out:t=>1-Math.pow(1-t,2.2),in:t=>t*t,lin:t=>t};
const rnd=(a,b)=>a+Math.random()*(b-a);

// ================= renderer / scene =================
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070d1f);scene.fog=new THREE.Fog(0x070d1f,50,105);
const camera=new THREE.PerspectiveCamera(44,420/720,0.1,250);
const GW=3.66,GH=2.44,ND=2.2,NBH=2.2; // goal half width, height, net depth, back height
const CAM0={pos:V(0,2.0,17.3),look:V(0,1.2,0)},CAMW={pos:V(0,2.9,22),look:V(0,1.3,2)};
const cam={pos:CAMW.pos.clone(),look:CAMW.look.clone(),shake:0};
function resize(){const r=$('wrap').getBoundingClientRect();renderer.setSize(r.width,r.height,false);const a=r.width/r.height;camera.aspect=a;
  const fill=a<1?.97:.72,hh=Math.atan(GW*1.06/fill/CAM0.pos.z);camera.fov=clamp(2*Math.atan(Math.tan(hh)/a)*180/Math.PI,30,62);camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
const maxAniso=renderer.capabilities.getMaxAnisotropy();

scene.add(new THREE.HemisphereLight(0xc8d8ff,0x24502a,1.15));
const sun=new THREE.DirectionalLight(0xfff6e8,2.6);
sun.position.set(7,22,16);sun.target.position.set(0,0,5);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-9,right:9,top:12,bottom:-12,near:2,far:60});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;
const rim=new THREE.DirectionalLight(0x9fb8ff,0.9);rim.position.set(-10,14,-22);scene.add(rim);

function canvasTex(w,h,draw,opts={}){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=maxAniso;Object.assign(t,opts);return t;}

// ---------- pitch ----------
{
  const PX=24,X0=-40,Z0=-30,WM=80,HM=70;
  const tex=canvasTex(WM*PX,HM*PX,(g,w,h)=>{
    const X=x=>(x-X0)*PX,Z=z=>(z-Z0)*PX;
    for(let i=0;i*4.5<HM;i++){g.fillStyle=i%2?'#2c8238':'#33924a';g.fillRect(0,i*4.5*PX,w,4.5*PX+1);}
    for(let i=0;i<60000;i++){g.fillStyle=Math.random()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.05)';g.fillRect(Math.random()*w,Math.random()*h,2,3);}
    g.strokeStyle='rgba(255,255,255,.93)';g.fillStyle='rgba(255,255,255,.93)';g.lineWidth=.12*PX;
    g.beginPath();g.moveTo(X(-36),Z(0));g.lineTo(X(36),Z(0));g.stroke();
    g.strokeRect(X(-9.16),Z(0),18.32*PX,5.5*PX);
    g.strokeRect(X(-20.16),Z(0),40.32*PX,16.5*PX);
    g.beginPath();g.arc(X(0),Z(11),.13*PX,0,7);g.fill();
    const a0=Math.asin(5.5/9.15);g.beginPath();g.arc(X(0),Z(11),9.15*PX,a0,Math.PI-a0);g.stroke();
  });
  const m=new THREE.Mesh(new THREE.PlaneGeometry(WM,HM),new THREE.MeshStandardMaterial({map:tex,roughness:.95}));
  m.rotation.x=-Math.PI/2;m.position.set(0,0,Z0+HM/2);m.receiveShadow=true;scene.add(m);
}

// ---------- goal & net ----------
{
  const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35});
  const grey=new THREE.MeshStandardMaterial({color:0x9aa3ad,roughness:.6});
  const post=(x)=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,GH+.06,20),white);p.position.set(x,GH/2,0);p.castShadow=true;scene.add(p);};
  post(-GW);post(GW);
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,GW*2+.12,20),white);bar.rotation.z=Math.PI/2;bar.position.set(0,GH,0);bar.castShadow=true;scene.add(bar);
  const pipe=(a,b)=>{const d=b.clone().sub(a);const m=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,d.length(),8),grey);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(AY,d.normalize());scene.add(m);};
  pipe(V(-GW,.02,-ND),V(GW,.02,-ND));pipe(V(-GW,NBH,-ND),V(GW,NBH,-ND));
  pipe(V(-GW,0,-ND),V(-GW,NBH,-ND));pipe(V(GW,0,-ND),V(GW,NBH,-ND));
  pipe(V(-GW,GH,0),V(-GW,NBH,-ND));pipe(V(GW,GH,0),V(GW,NBH,-ND));
  pipe(V(-GW,.02,0),V(-GW,.02,-ND));pipe(V(GW,.02,0),V(GW,.02,-ND));
  // static nets (roof & sides)
  const pts=[];const S=.16;
  const roofY=z=>lerp(GH,NBH,-z/ND);
  for(let x=-GW;x<=GW+1e-3;x+=S){pts.push(x,GH,0,x,NBH,-ND);}
  for(let z=0;z>=-ND-1e-3;z-=S){pts.push(-GW,roofY(z),z,GW,roofY(z),z);}
  for(const sx of[-GW,GW]){
    for(let z=0;z>=-ND-1e-3;z-=S)pts.push(sx,0,z,sx,roofY(z),z);
    for(let y=0;y<=GH;y+=S){const zz=y<=NBH?-ND:-ND*(GH-y)/(GH-NBH);pts.push(sx,y,0,sx,y,zz);}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  scene.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.42})));
}
// dynamic back net
const net={nx:Math.round(GW*2/.15),ny:Math.round(NBH/.15),D:0,ix:0,iy:1};
{
  const {nx,ny}=net;const base=[];
  for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++)base.push(-GW+GW*2*i/nx,NBH*j/ny,-ND);
  net.base=new Float32Array(base);
  const idx=[];const id=(i,j)=>j*(nx+1)+i;
  for(let j=0;j<=ny;j++)for(let i=0;i<nx;i++)idx.push(id(i,j),id(i+1,j));
  for(let i=0;i<=nx;i++)for(let j=0;j<ny;j++)idx.push(id(i,j),id(i,j+1));
  const g=new THREE.BufferGeometry();net.pos=new THREE.Float32BufferAttribute(new Float32Array(base),3);g.setAttribute('position',net.pos);g.setIndex(idx);
  net.mesh=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.55}));net.mesh.frustumCulled=false;scene.add(net.mesh);
}
function updateNet(){
  const a=net.pos.array,b=net.base;
  for(let k=0;k<a.length;k+=3){
    const dx=b[k]-net.ix,dy=b[k+1]-net.iy,f=net.D*Math.exp(-(dx*dx+dy*dy)/.32);
    a[k]=b[k]-dx*f*.25;a[k+1]=b[k+1]-dy*f*.25;a[k+2]=b[k+2]-f;
  }
  net.pos.needsUpdate=true;
}

// ---------- stadium ----------
function crowdTex(arms){
  const rng=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647;})();
  return canvasTex(1024,512,(g,w,h)=>{
    g.fillStyle='#1b2130';g.fillRect(0,0,w,h);
    const shirts=['#b91c1c','#b91c1c','#b91c1c','#991b1b','#e5e7eb','#d1d5db','#1e3a8a','#ca8a04','#166534','#374151','#1f2937','#111827','#7f1d1d','#e5e7eb'];
    const skins=['#f1c9a5','#d9a074','#8d5a3b','#f5d7bd'];
    for(let row=0;row<40;row++){
      const y=row*12.8+10;g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,y+5,w,3);
      for(let x=(row%2)*5;x<w;x+=10){

function loadMedals(){try{return JSON.parse(localStorage.getItem('pen_medals'))||{};}catch(e){return{};}}
function addMedal(team,kind){const m=loadMedals();m[team]=m[team]||{g:0,s:0,b:0};m[team][kind]++;try{localStorage.setItem('pen_medals',JSON.stringify(m));}catch(e){}}
const MED={g:'🥇',s:'🥈',b:'🥉'};
function medalStr(x){return x?['g','s','b'].filter(k=>x[k]).map(k=>MED[k]+(x[k]>1?x[k]:'')).join(' '):'';}
function showStats(){const c=loadCup();$('stats').innerHTML=c.played?`<div style="opacity:.55">ნათამაშები ტურნირები: ${c.played}</div>`:'';$('stats2').textContent='';}
function medalTable(m,emptyMsg){
  const rows=[...Array(16).keys()].map(i=>({i,g:+(m[i]?.g||0),s:+(m[i]?.s||0),b:+(m[i]?.b||0)}))
    .sort((x,y)=>(y.g-x.g)||(y.s-x.s)||(y.b-x.b)||(tn(x.i).localeCompare(tn(y.i))));
  const any=rows.some(r=>r.g+r.s+r.b);
  return (any?'':`<div style="opacity:.6;font-size:13px;margin-bottom:8px">${emptyMsg}</div>`)+
   `<table class="medt"><tr><th>#</th><th style="text-align:left">რეგიონი</th><th>🥇</th><th>🥈</th><th>🥉</th></tr>`+
   rows.map((r,n)=>`<tr ${r.i===myTeamHL?'style="color:#facc15"':''}><td style="opacity:.55">${n+1}</td><td>${chip(r.i)} ${tn(r.i)}</td><td>${r.g||'·'}</td><td>${r.s||'·'}</td><td>${r.b||'·'}</td></tr>`).join('')+`</table>`;
}

function newTournament(my){
  myTeamHL=my;
  const ids=[...Array(16).keys()].sort(()=>Math.random()-.5);
  const r0=[];for(let i=0;i<8;i++)r0.push({a:ids[i*2],b:ids[i*2+1],res:null});
  TOUR={my,rounds:[r0],out:false,champ:null,third:null,podium:null};
  const c=loadCup();c.played++;saveCup(c);
  $('pick').classList.add('hide');showBracket();
}
function nextMatch(){if(!TOUR||TOUR.champ!=null)return null;if(TOUR.third&&!TOUR.third.res)return TOUR.third;const r=TOUR.rounds[TOUR.rounds.length-1];const m=r.find(x=>!x.res);return m||null;}
const loser=m=>m.res.w===m.a?m.b:m.a;
function advance(){
  const r=TOUR.rounds[TOUR.rounds.length-1];if(r.some(x=>!x.res))return;
  if(r.length===1){
    if(TOUR.third&&!TOUR.third.res)return;
    const f=r[0];TOUR.champ=f.res.w;TOUR.podium={g:f.res.w,s:loser(f),b:TOUR.third.res.w};
    for(const k of['g','s','b'])if(TOUR.podium[k]===TOUR.my){addMedal(TOUR.my,k);getNet().then(n=>n.addMedal(TOUR.my,k)).catch(()=>{});}
    return;
  }
  const n=[];for(let i=0;i<r.length;i+=2)n.push({a:r[i].res.w,b:r[i+1].res.w,res:null});TOUR.rounds.push(n);
  if(r.length===2)TOUR.third={a:loser(r[0]),b:loser(r[1]),res:null,third:true};
}
function winnerOf(pr,cr){const ps=sum(pr),cs=sum(cr),pk=pr.length,ck=cr.length;
  if(pk<=5&&ck<=5){if(ps>cs+(5-ck))return'p';if(cs>ps+(5-pk))return'c';}
  if(pk===ck&&pk>=5&&ps!==cs)return ps>cs?'p':'c';return null;}
function simulate(pr=[],cr=[]){pr=[...pr];cr=[...cr];while(!winnerOf(pr,cr)){if(pr.length===cr.length)pr.push(Math.random()<.75);else cr.push(Math.random()<.75);}return{pr,cr};}
function record(m,pr,cr){ // pr/cr belong to m.a/m.b
  const w=winnerOf(pr,cr);m.res={sa:sum(pr),sb:sum(cr),w:w==='p'?m.a:m.b};
  const mine=m.a===TOUR.my||m.b===TOUR.my,isSemi=TOUR.rounds[2]&&TOUR.rounds[2].includes(m);
  if(mine&&(m.third||(m.res.w!==TOUR.my&&!isSemi)))TOUR.out=true; // a semi-final loser still plays for bronze
  advance();
}
function skipOne(){const m=nextMatch();if(!m)return;const r=simulate();record(m,r.pr,r.cr);}
function skipUntilMine(){let m;while((m=nextMatch())&&!(!TOUR.out&&(m.a===TOUR.my||m.b===TOUR.my)))skipOne();}

function startMatch(m,mine){

  human=mine?'p':null;setHUDTeams(A,B);

function finishMatch(){

  const wA=winnerOf(pRes,cRes)==='p',wTeam=wA?cur.A:cur.B,isFinal=cur.m===TOUR.rounds[3]?.[0],isThird=!!cur.m.third;

const setPath=(o,path,v)=>{const k=path.split('/');let c=o;for(let i=0;i<k.length-1;i++){if(c[k[i]]==null||typeof c[k[i]]!=='object')c[k[i]]={};c=c[k[i]];}if(v===null)delete c[k[k.length-1]];else c[k[k.length-1]]=v;};
// local test backend: two tabs of the same browser (?mock=1)
const MockNet={
  ls:{},key:c=>'mockroom_'+c,read(c){try{return JSON.parse(localStorage.getItem(this.key(c))||'null');}catch(e){return null;}},
  put(c,r){if(r===null)localStorage.removeItem(this.key(c));else localStorage.setItem(this.key(c),JSON.stringify(r));this.fire(c);},
  fire(c){const r=this.read(c);(this.ls[c]||[]).forEach(f=>setTimeout(()=>f(r)));},
  async init(){addEventListener('storage',e=>{if(e.key&&e.key.startsWith('mockroom_'))this.fire(e.key.slice(9));});},
  async exists(c){return!!this.read(c);},
  async create(c,o){this.put(c,o);},
  async join(c,g){const r=this.read(c);if(!r||r.guest)return false;r.guest=g;r.state='playing';this.put(c,r);return true;},
  watch(c,f){(this.ls[c]=this.ls[c]||[]).push(f);setTimeout(()=>f(this.read(c)));return()=>{this.ls[c]=(this.ls[c]||[]).filter(x=>x!==f);};},
  async set(c,path,v){const r=this.read(c);if(!r)return;setPath(r,path,v);this.put(c,r);},
  async leave(c,role){if(role==='host')this.put(c,null);else await this.set(c,'guest/online',false);},
  async addMedal(t,k){const m=JSON.parse(localStorage.getItem('mock_medals')||'{}');m[t]=m[t]||{};m[t][k]=(m[t][k]||0)+1;localStorage.setItem('mock_medals',JSON.stringify(m));},
  async getMedals(){return JSON.parse(localStorage.getItem('mock_medals')||'{}');}
};
// Firebase Realtime Database backend (config in firebase-config.js)
const FireNet={
  async init(){
    const cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.apiKey||/YOUR_/.test(cfg.apiKey))throw new Error('noconfig');
    const V='10.12.2',B=`https://www.gstatic.com/firebasejs/${V}/`;
    const [app,db,auth]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-database.js'),import(B+'firebase-auth.js')]);
    this.f=db;const a=app.initializeApp(cfg);this.db=db.getDatabase(a);
    await auth.signInAnonymously(auth.getAuth(a)); // silent, no sign-up for the player
  },
  r(c,p){return this.f.ref(this.db,'rooms/'+c+(p?'/'+p:''));},
  async exists(c){return (await this.f.get(this.r(c))).exists();},
  async create(c,o){await this.f.set(this.r(c),o);this.f.onDisconnect(this.r(c)).remove();},
  async join(c,g){
    // read first so the transaction starts from the server value, not an empty local cache
    const snap=await this.f.get(this.r(c));const cur=snap.val();
    if(!cur||cur.guest)return false;
    const tag=Math.random().toString(36).slice(2);g={...g,tag};
    const res=await this.f.runTransaction(this.r(c),r=>{if(r===null)return null;if(r.guest)return;r.guest=g;r.state='playing';return r;});
    const v=res.snapshot&&res.snapshot.val();const ok=!!(res.committed&&v&&v.guest&&v.guest.tag===tag);
    if(ok)this.f.onDisconnect(this.r(c,'guest/online')).set(false);return ok;},
  watch(c,f){return this.f.onValue(this.r(c),s=>f(s.val()));},
  async set(c,path,v){await this.f.set(this.r(c,path),v);},
  async leave(c,role){if(role==='host')await this.f.remove(this.r(c));else await this.f.set(this.r(c,'guest/online'),false);},
  async addMedal(t,k){const r=this.f.ref(this.db,`medals/${t}/${k}`);await this.f.get(r);await this.f.runTransaction(r,v=>(v||0)+1);},
  async getMedals(){return (await this.f.get(this.f.ref(this.db,'medals'))).val()||{};}
};

};
$('fJoin').onclick=async()=>{
  const code=$('fCode').value.trim();if(!/^\d{4}$/.test(code)){fMsg('ჩაწერე 4-ციფრიანი კოდი');return;}
  const n=await netOrError();if(!n)return;
  let ok=false;try{ok=await n.join(code,{team:myTeamF,online:true});}catch(e){console.error(e);fMsg(/permission/i.test(e.message)?'ბაზამ წვდომა უარყო — შეამოწმე Rules და Anonymous შესვლა.':'შეცდომა: '+e.message);return;}
  if(!ok){fMsg('მატჩი ვერ მოიძებნა ან უკვე დაწყებულია');return;}
  online={role:'guest',code,k:0,round:0,picked:false,pz:-1,started:false,ended:false,rm:0,room:null};
  online.unwatch=n.watch(code,onRoom);
};
$('fBack').onclick=()=>{leaveOnline();$('friend').classList.add('hide');buildPick();setMode('friend');$('pick').classList.remove('hide');};
function leaveOnline(){if(!online)return;try{online.unwatch&&online.unwatch();}catch(e){}if(NET)NET.leave(online.code,online.role).catch(()=>{});online=null;human=null;}
const myKey=()=>online.role==='host'?'h':'g';
function startOnline(r){
  online.started=true;online.ended=false;online.k=0;online.picked=false;online.pz=-1;
  const A=r.host.team,B=r.guest.team;
  cur={m:null,A,B,kits:matchKits(TEAMS[A],TEAMS[B])};
  rigs.kickA.setKit(cur.kits.ka);rigs.kickB.setKit(cur.kits.kb);rigs.gkA.setKit(cur.kits.ga);rigs.gkB.setKit(cur.kits.gb);
  human=online.role==='host'?'p':'c';setHUDTeams(A,B);
  ['friend','pick','end','bracket'].forEach(id=>$(id).classList.add('hide'));$('hud').style.visibility='visible';$('skip').style.display='none';
  pRes=[];cRes=[];playerShots=[];turn='p';sfx.whistle(false);setupKick();
}
function onlinePick(z){
  if(!online||online.picked||state!=='aim')return;
  online.picked=true;online.pz=z;hint('⏳ ელოდება მეტოქეს…');
  NET.set(online.code,`m${online.round}/${online.k}/${myKey()}`,z);
}
function onRoom(r){
  if(!online)return;
  if(!r){if(online.started&&!online.ended)opponentLeft();else if(online.role==='guest')opponentLeft();return;}
  online.room=r;
  const oppOn=online.role==='host'?(r.guest&&r.guest.online!==false):(r.host&&r.host.online!==false);
  if(online.started&&r.guest&&!oppOn&&!online.ended){opponentLeft();return;}
  if(!online.started&&r.guest&&r.host){startOnline(r);return;}
  // rematch: both pressed
  const rm=r.rematch||{};if(online.ended&&rm.h>online.round&&rm.g>online.round){online.round++;startOnline(r);return;}
  if(!online.started||online.ended)return;
  const kk=(r['m'+online.round]||{})[online.k];if(!kk)return;
  if(online.role==='host'&&kk.h!=null&&kk.g!=null&&!kk.res){
    const shooterHost=online.k%2===0,sh=shooterHost?kk.h:kk.g,dv=shooterHost?kk.g:kk.h;
    NET.set(online.code,`m${online.round}/${online.k}/res`,planKick(sh,dv));return;
  }
  if(kk.res&&state==='aim'&&online.picked){execKick(kk.res);}
}
function opponentLeft(){
  if(!online)return;online.ended=true;state='over';
  $('eicon').textContent='📴';$('etitle').textContent='მეტოქე გავიდა';$('eteams').innerHTML='';$('escore').textContent='';
  const box=$('eBtns');box.innerHTML='';const e=document.createElement('button');e.className='btn sm';e.textContent='🏠 მენიუ';e.onclick=backToMenu;box.appendChild(e);
  $('friend').classList.add('hide');$('end').classList.remove('hide');
}
function backToMenu(){leaveOnline();state='menu';$('end').classList.add('hide');$('hud').style.visibility='hidden';hint('');buildPick();setMode('friend');$('pick').classList.remove('hide');}
function finishOnline(){
  online.ended=true;state='over';renderHUD();sfx.whistle(true);
  const w=winnerOf(pRes,cRes),iWon=w===human;if(iWon)cheer=4;
  $('eicon').textContent=iWon?'🏆':'😔';$('etitle').textContent=iWon?'გაიმარჯვე!':'წააგე';
  $('eteams').innerHTML=`${chip(cur.A)} ${tn(cur.A)} — ${tn(cur.B)} ${chip(cur.B)}`;$('escore').textContent=`${sum(pRes)} : ${sum(cRes)}`;
  const box=$('eBtns');box.innerHTML='';
  const r=document.createElement('button');r.className='btn sm';r.textContent='🔁 რევანში';
  r.onclick=()=>{r.disabled=true;r.textContent='⏳ ელოდება მეტოქეს…';NET.set(online.code,'rematch/'+myKey(),online.round+1);};
  const m=document.createElement('button');m.className='btn2';m.textContent='🏠 მენიუ';m.onclick=backToMenu;
  box.appendChild(r);box.appendChild(m);setTimeout(()=>$('end').classList.remove('hide'),500);
}
function setTeams(){
  const pk=turn==='p';
  kicker=pk?rigs.kickA:rigs.kickB;keeper=pk?rigs.gkB:rigs.gkA;
  kicker.setNum(NUMS[(Math.random()*NUMS.length)|0]);
  for(const r of Object.values(rigs))r.root.visible=(r===kicker||r===keeper);
}
function setupKick(){
  setTeams();
  ball.p.copy(SPOT);ball.v.set(0,0,0);ball.mode='spot';ballMesh.quaternion.identity();
  net.D=0;updateNet();
  gFrames=null;kAfter=null;keeperX=0;catchIt=false;aimT=0;
  kT=0;state='aim';hover=-1;resultShown=false;
  cam.pos.copy(CAMW.pos);cam.look.copy(CAMW.look);
  if(human)hint(turn===human?'🎯 შეეხე კარს — სად დაარტყამ?':'🧤 შენ მეკარე ხარ — სად გადახტები?');
  else hint(`👀 ${tn(cur.A)} — ${tn(cur.B)}`);
  renderHUD();
}
function startGame(){}
function cpuDive(z){const n=playerShots.length;let read=.1;if(n>=2&&playerShots[n-1]===z&&playerShots[n-2]===z)read=.55;else if(n>=1&&playerShots[n-1]===z)read=.22;return Math.random()<read?z:(Math.random()*6|0);}
function cpuShot(){const w=[.21,.1,.21,.19,.1,.19];let r=Math.random();for(let i=0;i<6;i++){r-=w[i];if(r<=0)return i;}return 5;}
const TF=.62;
function planKick(shot,dive,fo){
  const col=shot%3,row=shot/3|0;let outcome;
  if(col!==1&&Math.random()<.07)outcome='post';
  else if(dive===shot)outcome='save';
  else if(dive%3===col&&Math.random()<.3)outcome='save';
  else outcome='goal';
  if(fo)outcome=fo;
  let tx=ZX[col]+rnd(-.35,.35),ty=ZY[row]+rnd(-.18,.2);
  if(outcome==='post'){if(row===0&&Math.random()<.5){ty=GH-.02;tx=ZX[col]+rnd(-.3,.3);}else tx=(col===0?-1:1)*(GW-.06);}
  const dc=dive%3,dr=dive/3|0;
  return{shot,dive,outcome,tx,ty,gx:ZX[dc]+rnd(-.25,.25),gy:ZY[dr]+rnd(-.12,.12)};
}
function execKick(d){
  shot=d.shot;dive=d.dive;outcome=d.outcome;const col=shot%3;
  ball.p0.copy(SPOT);
  const P1=V(d.tx,d.ty,0);
  ball.v0.copy(P1).sub(SPOT).divideScalar(TF);ball.v0.y+=.5*9.81*TF;
  const tcz=TF*(SPOT.z-.5)/SPOT.z;
  const atZ=t=>V(ball.p0.x+ball.v0.x*t,ball.p0.y+ball.v0.y*t-4.905*t*t,ball.p0.z+ball.v0.z*t);
  if(outcome==='save'){G=atZ(tcz);ball.tc=tcz;catchIt=col===1;}
  else{G=V(d.gx,d.gy,.5);ball.tc=TF*(SPOT.z-.12)/SPOT.z;}
  state='runup';kT=0;hint('');
  kFrames=kickFrames();
}
function choose(z,fd,fo){
  if(state!=='aim')return;
  let sh,dv;
  if(human&&turn===human){sh=z;dv=cpuDive(z);playerShots.push(z);}
  else if(human){dv=z;sh=cpuShot();}
  else{sh=cpuShot();dv=Math.random()*6|0;}
  if(fd!=null){if(turn==='p')dv=fd;else sh=fd;}
  execKick(planKick(sh,dv,fo));
}
function launch(){
  state='flight';ball.mode='fly';ball.t=0;sfx.kick();
  gStart=T+.06;
  gFrames=keeperFrames(copyPose(gPose),G,keeperX,catchIt,outcome==='save');
}
function showResult(kind){
  if(resultShown)return;resultShown=true;
  const isGoal=kind==='goal',good=human?(turn===human)===isGoal:isGoal;
  (turn==='p'?pRes:cRes).push(isGoal);
  let txt;
  if(!human)txt=isGoal?'გოლი!':kind==='save'?'მოიგერია!':'ძელი!';
  else if(turn===human)txt=isGoal?'გოლი!':kind==='save'?'მოიგერია!':'ძელი!';
  else txt=isGoal?'გაიტანეს...':kind==='save'?'შენ მოიგერიე!':'ძელი! 😅';
  banner(txt,good?'#facc15':(human?'#f87171':'#ffffff'));
  if(good){cheer=2.5;sfx.cheer();}else sfx.groan();
  kAfter={good:isGoal,t0:T+.25};
  state='result';rT=0;renderHUD();
}
function winner(){return winnerOf(pRes,cRes);}
function next(){
  if(winner()){online?finishOnline():finishMatch();return;}
  state='fade';$('fade').style.opacity=1;
  setTimeout(()=>{turn=turn==='p'?'c':'p';if(online){online.k++;online.picked=false;online.pz=-1;}setupKick();$('fade').style.opacity=0;if(online)onRoom(online.room);},260);
}

// ---------- input ----------
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),goalPlane=new THREE.Plane(V(0,0,1),0);
function zoneAt(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);const p=ray.ray.intersectPlane(goalPlane,V());
  if(!p||Math.abs(p.x)>GW+.4||p.y<-.3||p.y>GH+.4)return -1;const c=p.x<-GW/3?0:p.x>GW/3?2:1,rr=p.y>GH/2?0:1;return rr*3+c;}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='aim'||!human)return;const z=zoneAt(e);if(z<0)return;if(online)onlinePick(z);else choose(z);});
canvas.addEventListener('pointermove',e=>{hover=state==='aim'?zoneAt(e):-1;});
canvas.addEventListener('pointerleave',()=>hover=-1);


// ================= update =================
const HB=V();
function ballPhysics(dt){
  const n=4,h=dt/n;
  for(let i=0;i<n;i++){
    const p=ball.p,v=ball.v;v.y-=9.81*h;
    if(p.z<0&&Math.abs(p.x)<GW+.2&&p.y<GH+.2){
      const pen=(-ND+BR)-p.z;if(pen>0){v.z+=(700*pen-(v.z<0?18*v.z:4*v.z))*h;v.x*=1-6*h;v.y*=1-3*h;}
      const ry=lerp(GH,NBH,-p.z/ND)-BR;if(p.y>ry){v.y-=(500*(p.y-ry)+10*v.y)*h;}
      for(const sx of[-1,1]){const px=sx*(GW-BR);if(sx*p.x>sx*px&&p.z<-.05){v.x-=(500*(p.x-px)+10*v.x)*h;}}
      net.D=Math.max(net.D*Math.pow(.02,h),Math.max(0,pen));net.ix=p.x;net.iy=p.y;
    }else net.D*=Math.pow(.02,h);
    p.addScaledVector(v,h);
    if(p.y<BR){p.y=BR;if(v.y<-1)sfx.bounce(-v.y);v.y=-v.y*.52;v.x*=.9;v.z*=.9;if(Math.abs(v.y)<.3)v.y=0;v.x*=1-1.2*h;v.z*=1-1.2*h;}
  }
}
function spinBall(dt){const sp=ball.v.length();if(sp>.05){const axis=V().crossVectors(AY,ball.v).normalize();ballMesh.quaternion.premultiply(Q().setFromAxisAngle(axis,sp/BR*dt));}}
function update(dt){
  T+=dt;
  // crowd
  if(cheer>0){cheer-=dt;const f=Math.floor(T*8)%2;standMat.map=standMat.emissiveMap=f?crowdB:crowdA;}else{standMat.map=standMat.emissiveMap=crowdA;}
  adTex.offset.x=(T*.03)%1;
  if(state==='load'||!rigs)return;
  // ---- kicker ----
  if(state==='runup'||state==='flight'||state==='result'||state==='fade'||state==='over'){
    kT+=dt;const tau=kT-TR;
    if(tau<0){
      const u=clamp(kT/(TR-.14)),sd=u*(.5+.5*u),p=RUN_A.clone().lerp(KROOT,sd);
      const yaw=lerp(RUN_YAW,KY,smooth(clamp((u-.7)/.3)));
      runPose(p,yaw,Math.PI+3*Math.PI*sd,.22+.28*smooth(clamp(sd*3.5)),tmpPose);
      if(kT<.16)lerpPose(kickerIdle(),tmpPose,smooth(kT/.16),tmpPose);
      if(tau>-.14)lerpPose(tmpPose,kFrames[0].P,smooth((tau+.14)/.14),tmpPose);
      applyPose(kicker,tmpPose,null);
    }else{
      if(kAfter&&T>kAfter.t0){const a=evalFrames(kFrames,tau,tmpPose);lerpPose(a,kickerAfter(kAfter.good,T),smooth(clamp((T-kAfter.t0)/.45)),kPose);}
      else evalFrames(kFrames,tau,kPose);
      applyPose(kicker,kPose,null);
    }
    if(state==='runup'&&kT>=TCON)launch();
  }else{
    applyPose(kicker,kickerIdle(),null);
  }
  // ---- keeper ----
  lookTarget.copy(ball.p);
  if(!gFrames||T<gStart){
    keeperX=.12*Math.sin(T*1.3);
    let ey=0;const u=(kT-(TR-.18))/.29;
    if(state==='runup'&&u>0)ey=u<.55?.07*Math.sin(Math.PI*u/.55):-.08*clamp((u-.55)/.45);
    if(state==='flight')ey=-.08;
    copyPose(readyPose(keeperX,T,ey),gPose);
  }else evalFrames(gFrames,T-gStart,gPose);
  applyPose(keeper,gPose,lookTarget);
  // ---- ball ----
  if(ball.mode==='fly'){
    ball.t+=dt;const t=ball.t;
    ball.p.set(ball.p0.x+ball.v0.x*t,ball.p0.y+ball.v0.y*t-4.905*t*t,ball.p0.z+ball.v0.z*t);
    ball.v.set(ball.v0.x,ball.v0.y-9.81*t,ball.v0.z);
    if(t>=ball.tc&&outcome==='save'){
      sfx.save();cam.shake=.06;
      if(catchIt){ball.mode='held';}
      else{const s=Math.sign(G.x)||1;ball.v.set(s*rnd(2.5,4.5),rnd(1,3)+(G.y>1.4?2:0),rnd(2.5,5));ball.mode='free';}
      showResult('save');
    }else if(t>=ball.tc&&outcome==='post'){
      sfx.post();cam.shake=.12;
      if(ball.p.y>GH-.2)ball.v.set(ball.v.x*.4,rnd(2,4),rnd(3,6));else ball.v.set(-Math.sign(ball.p.x)*rnd(1.5,3.5),ball.v.y*.3,rnd(4,7));
      ball.mode='free';showResult('post');
    }else if(ball.p.z<0&&outcome==='goal'){ball.mode='free';}
  }else if(ball.mode==='free'){
    ballPhysics(dt);
    if(outcome==='goal'&&!resultShown&&ball.p.z<-.4){showResult('goal');sfx.net();cam.shake=.05;}
  }else if(ball.mode==='held'){
    const a=keeper.b.LeftHand.getWorldPosition(V()),c=keeper.b.RightHand.getWorldPosition(V());
    HB.copy(a).add(c).multiplyScalar(.5).add(V(0,0,.1));ball.p.lerp(HB,Math.min(1,dt*25));ball.v.set(0,0,0);
  }
  if(ball.mode!=='held')spinBall(dt);
  if(net.D>.001||ball.mode==='free')updateNet();
  ballMesh.position.copy(ball.p);
  if(state==='result'){rT+=dt;if(rT>2.5)next();}
  // ---- markers ----
  if(state==='aim'&&!human&&cur&&!online){aimT+=dt;if(aimT>1.0)choose(-1);}
  markers.forEach((m,z)=>{m.visible=state==='aim'&&!!human&&(!online||!online.picked||z===online.pz);m.material.map=turn===human?tgtTex:gloveTex;const s=(z===hover?1.25:1)*(1+.06*Math.sin(T*4+z));m.scale.set(s,s,1);});
  // ---- camera ----
  if(state==='aim'||state==='menu'){cam.pos.lerp(CAMW.pos,dt*2);cam.look.lerp(CAMW.look,dt*2);}
  if(state==='runup'){const k=1-Math.pow(.04,dt);cam.pos.lerp(CAM0.pos,k);cam.look.lerp(CAM0.look,k);}
  if(state==='flight'||state==='result'){cam.pos.lerp(V(ball.p.x*.12,1.95,16.7),dt*1.5);cam.look.lerp(V(ball.p.x*.25,1.2,0),dt*2);}
  cam.shake*=Math.pow(.02,dt);
  camera.position.copy(cam.pos).add(V(rnd(-1,1)*cam.shake,rnd(-1,1)*cam.shake,0));camera.lookAt(cam.look);
  const co=window.__game&&window.__game.camOverride;if(co){camera.position.set(...co[0]);camera.lookAt(...co[1]);}
}

// ================= load =================
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000)*(window.__ts==null?1:window.__ts);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}
camera.position.copy(cam.pos);camera.lookAt(cam.look);
renderHUD();requestAnimationFrame(loop);
fetch('player.glb').then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer();}).then(buf=>new Promise((res,rej)=>{const L=new GLTFLoader();L.setMeshoptDecoder(MeshoptDecoder);L.parse(buf,'',res,rej);})).then(gltf=>{
  prepareSource(gltf.scene);
  rigs={kickA:new Rig(gltf.scene,KITS.pKick,false),kickB:new Rig(gltf.scene,KITS.cKick,false),gkA:new Rig(gltf.scene,KITS.pGK,true),gkB:new Rig(gltf.scene,KITS.cGK,true)};
  HIPS_REST=rigs.kickA.hipsRest.clone();FY=rigs.kickA.footY;
  const k0=matchKits(TEAMS[0],TEAMS[6]);rigs.kickA.setKit(k0.ka);rigs.kickB.setKit(k0.kb);rigs.gkA.setKit(k0.ga);rigs.gkB.setKit(k0.gb);
  turn='p';setTeams();state='menu';
  buildPick();
  window.__ready=true;
}).catch(e=>{$('pickSub').textContent='ჩატვირთვა ვერ მოხერხდა';console.error(e);});
buildPick();
// test hooks
window.__game0={forceMine(win){const m=nextMatch();const meA=m.a===TOUR.my;const W=[true,true,true,true,true],L=[false,false,false];record(m,(meA===win)?W:L,(meA===win)?L:W);showBracket();},skipMine(){skipUntilMine();showBracket();},pick:z=>onlinePick(z),get score(){return JSON.stringify([pRes,cRes,turn,online&&online.k])},step(sec){for(let i=0;i<Math.round(sec*60);i++)update(1/60);renderer.render(scene,camera);},choose,get state(){return state},startGame(){newTournament(0);const m=nextMatch();if(!(m.a===0||m.b===0)){skipUntilMine();}startMatch(nextMatch(),true);},camOverride:null};

<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>კოდის გამტეხი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+Georgian:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* A street of storybook doors: cobalt night street, each topic a differently built door with a simple 4-digit lock */
  --street:#2a43c4; --street-deep:#1c2f99; --ink:#151a3a; --paper:#fffdf5; --sun:#ffc93c;
  --go:#1fbf6b; --no:#e5383b;
  --p1:#ff6b6b; --p2:#ff9f1c; --p3:#16b6a6; --p4:#9b5de5;
  --body:"Noto Sans Georgian",system-ui,sans-serif; --digits:"Bungee","Arial Black",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--street);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:radial-gradient(rgba(255,255,255,.09) 2px,transparent 2.5px);background-size:26px 26px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
.chunk{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink)}
.btn{color:var(--ink);border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:8px 14px;font-weight:800;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.sun{background:var(--sun)} .btn.go{background:var(--go);color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:#fff;box-shadow:3px 3px 0 var(--street-deep)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;color:#fff}
h1{font-weight:900;font-size:clamp(30px,5vw,46px);margin:0;line-height:1;text-shadow:3px 3px 0 var(--ink)}
.sub{margin:6px 0 0;font-weight:600;opacity:.9}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.starsTotal{font-family:var(--digits);font-size:19px;background:var(--ink);color:var(--sun);padding:6px 12px;border-radius:10px}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;color:#fff;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--sun)}

/* home: the street */
.street{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px}
.house{position:relative;padding:14px 12px 12px;display:grid;justify-items:center;gap:6px;text-align:center;background:var(--wall)}
.house .mini{width:62px;height:82px;margin-bottom:4px}
.house .num{font-family:var(--digits);font-size:14px;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px}
.house h3{margin:0;font-size:17px;font-weight:900;text-wrap:balance;color:var(--ink)}
.house .dname{font-size:13px;font-weight:700;opacity:.75}
.house.dark h3,.house.dark .dname{color:#fff}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.s1{background:#ffe08a}.dots i.s2{background:var(--sun)}.dots i.s3{background:var(--go)}
.house.locked{filter:grayscale(.85) brightness(.85);cursor:not-allowed}
.house:not(.locked):hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}

/* mini door used on the street */
.mini{position:relative;border:3px solid var(--ink);background:var(--frame);padding:5px}
.mini i{display:block;width:100%;height:100%;border:2px solid var(--ink)}
.mini.shape-round{width:74px;height:74px}

/* topic page */
.intro{padding:20px 22px;display:grid;gap:10px;margin-bottom:20px}
.intro .tag{display:inline-block;background:var(--sun);border:2.5px solid var(--ink);border-radius:8px;padding:2px 10px;font-weight:900;font-size:14px;width:max-content}
.intro h2{margin:0;font-size:clamp(24px,4vw,32px);font-weight:900;text-wrap:balance}
.intro p{margin:0;max-width:65ch}
.example{background:#eef1ff;border:2.5px dashed var(--street);border-radius:10px;padding:8px 12px;font-weight:700;max-width:65ch}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.lv{padding:12px;text-align:left;display:grid;gap:4px;align-content:start}
.lv .row1{display:flex;justify-content:space-between;align-items:center}
.lv b{font-family:var(--digits);font-size:24px}
.lv .st{font-size:17px;letter-spacing:1px}
.lv .note{font-size:14px;font-weight:700;line-height:1.3}
.lv .uses{font-size:12px;font-weight:600;opacity:.75;line-height:1.3}
.lv .many{font-size:12px;font-weight:800;background:#e8fff1;border:2px solid var(--go);color:#0b6b37;border-radius:6px;padding:0 6px;width:max-content}
.lv.locked{opacity:.5;cursor:not-allowed}

/* play */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#fff;margin-bottom:18px}
.bar .where{font-weight:800;font-size:18px;line-height:1.25}
.bar .where small{display:block;font-weight:600;opacity:.85;font-size:14px}
.bar .sp{flex:1}
.useschip{color:#fff;font-size:13px;font-weight:700;opacity:.9}
.notechip{background:var(--sun);color:var(--ink);border:2.5px solid var(--ink);border-radius:8px;padding:2px 10px;font-weight:800;font-size:14px}
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:840px){.play{grid-template-columns:1fr}}
.clues{display:grid;gap:12px}
.recall{color:#fff;border:2.5px solid rgba(255,255,255,.6);border-radius:12px;padding:8px 12px}
.recall summary{cursor:pointer;font-weight:800}
.recall p{margin:6px 0 0;font-size:15px}
.story{padding:14px 16px;font-size:18px;background:#fff8dc}
.story b{display:block;font-size:13px;color:var(--street);margin-bottom:4px}
.clue{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);font-size:18px;font-weight:600}
.clue .box{flex:none;width:26px;height:26px;border:3px solid var(--ink);border-radius:7px;display:grid;place-items:center;font-weight:900;background:#fff;margin-top:1px}
.clue.done{opacity:.6;box-shadow:2px 2px 0 var(--ink)}
.clue.done .box{background:var(--go);color:#fff}
.clue.done .tx{text-decoration:line-through;text-decoration-thickness:2px}
.clue.auto{cursor:default}
.clue.fail{border-color:var(--no);box-shadow:4px 4px 0 var(--no);opacity:1;background:#fff1f1}
.clue.fail .tx{text-decoration:none}
.clue .failtag{position:absolute;top:-12px;right:10px;background:var(--no);color:#fff;font-size:12px;font-weight:800;padding:1px 8px;border-radius:6px;border:2px solid var(--ink)}
.pw{border-radius:5px;padding:0 3px;box-shadow:inset 0 -5px 0 var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pw1{--c:var(--p1)}.pw2{--c:var(--p2)}.pw3{--c:var(--p3)}.pw4{--c:var(--p4)}
.tip{color:#fff;font-size:14px;opacity:.85;margin:2px 0 0}

/* the door scene */
.scene{position:relative;background:var(--wall);border:3px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--ink);padding:18px 16px 0;display:grid;justify-items:center;overflow:hidden}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--ground,rgba(0,0,0,.14));border-top:3px solid var(--ink)}
.sign{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:2px 14px;font-weight:900;font-size:16px;margin-bottom:12px;box-shadow:3px 3px 0 var(--ink);z-index:1}
.frame{position:relative;width:min(340px,100%);aspect-ratio:3/4;background:var(--frame);border:4px solid var(--ink);padding:14px;perspective:1200px;z-index:1;margin-bottom:34px}
.shape-round .frame{aspect-ratio:1/1}
.shape-rect .frame{border-radius:16px}
.shape-arch .frame{border-radius:200px 200px 16px 16px}
.shape-round .frame{border-radius:50%}
.doorway,.leaf{position:absolute;inset:14px;border:3px solid var(--ink)}
.shape-rect .doorway,.shape-rect .leaf{border-radius:8px}
.shape-arch .doorway,.shape-arch .leaf{border-radius:190px 190px 8px 8px}
.shape-round .doorway,.shape-round .leaf{border-radius:50%}
.doorway{background:radial-gradient(circle at 50% 40%,#fff9dc,#ffd987 55%,#f0a64a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;overflow:hidden}
.shape-arch .doorway{padding-top:22%}
.shape-round .doorway{padding:15%;gap:4px}
.doorway .prize{font-size:clamp(46px,9vw,64px);line-height:1}
.doorway .wstars{font-size:26px;letter-spacing:4px;color:#d49100;line-height:1}
.doorway h3{margin:0;font-size:20px;font-weight:900;line-height:1.2}
.doorway .code{font-family:var(--digits);font-size:22px;letter-spacing:4px}
.doorway .others{font-size:13px;font-weight:700;line-height:1.3}
.doorway .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.doorway .chips span{font-family:var(--digits);font-size:12px;border:2px solid var(--ink);border-radius:6px;padding:0 5px;background:#fff}
.doorway .again{background:none;border:0;text-decoration:underline;font-weight:700;font-size:14px;padding:2px}
.nextdoor{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:6px 12px 6px 8px;font-weight:900;font-size:16px;box-shadow:3px 3px 0 var(--ink);margin-top:4px}
.nextdoor .mini{width:30px;height:40px;padding:3px;border-width:2px}
.nextdoor .mini.shape-round{width:38px;height:38px}
.nextdoor:hover{background:var(--sun)}
.doorway > *{opacity:0;transform:translateY(8px);transition:opacity .4s .25s,transform .4s .25s}
.scene.open .doorway > *{opacity:1;transform:none}
.leaf{background:var(--door);display:grid;place-items:center;z-index:2;overflow:hidden;transition:opacity .35s,transform .35s}
.scene.open .leaf{opacity:0;transform:scale(1.04);pointer-events:none;visibility:hidden;transition:opacity .35s,transform .35s,visibility 0s .35s}
.scene.shake .leaf{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.knob{position:absolute;right:16px;top:58%;width:18px;height:18px;border-radius:50%;background:var(--sun);border:3px solid var(--ink)}
.shape-round .knob{display:none}
.shape-arch .leaf .plate{margin-top:22%}

/* door textures */
.tex-planks .leaf{background:repeating-linear-gradient(90deg,var(--door) 0 36px,var(--door2) 36px 39px)}
.tex-hplanks .leaf{background:repeating-linear-gradient(0deg,var(--door) 0 34px,var(--door2) 34px 37px)}
.tex-panels .leaf{background:linear-gradient(var(--door2),var(--door2)) 50% 12%/62% 4px no-repeat,linear-gradient(var(--door2),var(--door2)) 50% 88%/62% 4px no-repeat,var(--door)}
.tex-metal .leaf{background:radial-gradient(circle,var(--door2) 3px,transparent 4px) 0 0/30px 30px,linear-gradient(160deg,var(--door),var(--door2) 160%)}
.tex-stripes .leaf{background:repeating-linear-gradient(90deg,var(--door) 0 28px,var(--door2) 28px 56px)}
.tex-stars .leaf{background:radial-gradient(circle at 20% 30%,#fff 1.6px,transparent 2.6px) 0 0/38px 38px,radial-gradient(circle at 70% 70%,rgba(255,255,255,.6) 1.6px,transparent 2.6px) 0 0/52px 52px,var(--door)}
.tex-ice .leaf{background:linear-gradient(130deg,transparent 0 18%,rgba(255,255,255,.75) 18% 22%,transparent 22% 55%,rgba(255,255,255,.55) 55% 58%,transparent 58%),linear-gradient(180deg,var(--door),var(--door2))}
.tex-bars .leaf{background:repeating-linear-gradient(90deg,var(--door2) 0 12px,var(--door) 12px 46px)}
.tex-barn .leaf{background:linear-gradient(to top right,transparent calc(50% - 5px),#fdf0d5 calc(50% - 5px) calc(50% + 5px),transparent calc(50% + 5px)),linear-gradient(to top left,transparent calc(50% - 5px),#fdf0d5 calc(50% - 5px) calc(50% + 5px),transparent calc(50% + 5px)),repeating-linear-gradient(90deg,var(--door) 0 30px,var(--door2) 30px 33px)}
.tex-bands .leaf{background:linear-gradient(var(--frame),var(--frame)) 0 22%/100% 12px no-repeat,linear-gradient(var(--frame),var(--frame)) 0 78%/100% 12px no-repeat,repeating-linear-gradient(0deg,var(--door) 0 30px,var(--door2) 30px 33px)}
.mini.tex-planks i,.mini.tex-hplanks i,.mini.tex-panels i,.mini.tex-metal i,.mini.tex-stripes i,.mini.tex-stars i,.mini.tex-ice i,.mini.tex-bars i,.mini.tex-barn i,.mini.tex-bands i{background:var(--door)}
.mini.tex-stripes i{background:repeating-linear-gradient(90deg,var(--door) 0 6px,var(--door2) 6px 12px)}
.mini.tex-planks i{background:repeating-linear-gradient(90deg,var(--door) 0 8px,var(--door2) 8px 9px)}
.mini.shape-arch,.mini.shape-arch i{border-radius:40px 40px 4px 4px}
.mini.shape-round,.mini.shape-round i{border-radius:50%}
.mini.shape-rect,.mini.shape-rect i{border-radius:5px}

/* the lock: four big windows, nothing else */
.plate{position:relative;z-index:3;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:min(250px,82%);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.slot{display:grid;gap:3px;justify-items:stretch}
.arr{border:2.5px solid var(--ink);background:#fff;border-radius:8px;font-weight:900;font-size:13px;line-height:1;padding:5px 0}
.arr:active{background:var(--sun)}
.win{display:grid;place-items:center;height:58px;font-family:var(--digits);font-size:34px;background:#fff;border:3px solid var(--ink);border-radius:9px;cursor:pointer;border-bottom:7px solid var(--c)}
.slot:nth-child(1){--c:var(--p1)}.slot:nth-child(2){--c:var(--p2)}.slot:nth-child(3){--c:var(--p3)}.slot:nth-child(4){--c:var(--p4)}
.slot.sel .win{background:#fffbe3;outline:3px solid var(--c);outline-offset:1px}
.win.empty{color:#c5c7d6}
.win.lockd{background:#e9fbe9}

.panel{display:grid;gap:10px;margin-top:16px}
.acts{display:flex;gap:10px}
.acts .open{flex:1;font-size:21px;padding:10px}
.meta{display:flex;justify-content:space-between;color:#fff;font-weight:700;font-size:14px}
.msg{min-height:24px;font-weight:800;color:#fff;text-align:center}
.winbox{padding:16px;display:grid;gap:10px;justify-items:center;text-align:center}
.winbox .big{font-size:44px;letter-spacing:6px;color:#e0a800;line-height:1}
.winbox h3{margin:0;font-size:24px;font-weight:900}
.winbox .code{font-family:var(--digits);font-size:28px;letter-spacing:5px}
.winbox .others{font-size:15px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips span{font-family:var(--digits);font-size:15px;border:2px solid var(--ink);border-radius:7px;padding:1px 7px;background:#eef1ff}
.winbox .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){.leaf,.doorway > *{transition:none}.scene.shake .leaf{animation:none}}
</style>
</head>

function markup(t){
  t=esc(t);
  return t.replace(/(ბოლოსწინა|ბოლოდან მეორე|ბოლო[ა-ჰ]*|პირველ[ა-ჰ]*|მეორ[ა-ჰ]*|მესამ[ა-ჰ]*|მეოთხ[ა-ჰ]*)(?![ა-ჰ])(?! (?:ორ|სამ)[ა-ჰ]*)/g,m=>{
    const p=/^ბოლოსწინა|^ბოლოდან/.test(m)?3:/^ბოლო/.test(m)?4:/^პირველ/.test(m)?1:/^მეორ/.test(m)?2:/^მესამ/.test(m)?3:4;
    return `<span class="pw pw${p}">${m}</span>`;});
}

function header(){
  return `<header class="top"><div><h1>კოდის გამტეხი</h1>
  <p class="sub">${DATA.length} კარი · ${LEVELS} საკეტი · წაიკითხე პირობები და გააღე კარი</p></div>
  <div class="tools"><span class="starsTotal" title="შეგროვებული ვარსკვლავები">★ ${totalStars()}/${LEVELS*3}</span>
  <label class="toggle"><input type="checkbox" id="test" ${S.test?"checked":""}> ყველა დონე გახსნილია</label>
  <button class="btn ghost" id="reset">${view.confirmReset?"ნამდვილად წავშალო?":"პროგრესის წაშლა"}</button></div></header>`;
}
function bindHeader(){
  document.getElementById("test").onchange=e=>{S.test=e.target.checked;save();render()};
  document.getElementById("reset").onclick=()=>{if(view.confirmReset){S.progress={};save();view.confirmReset=false}else view.confirmReset=true;render()};
}
const mini=th=>`<span class="mini shape-${th.shape} tex-${th.tex}" style="${themeVars(th)}" aria-hidden="true"><i></i></span>`;

function home(){
  app.innerHTML=header()+`<main class="street">${DATA.map((t,i)=>{
    const th=THEMES[i],open=topicOpen(i);
    return `<button class="chunk house ${open?"":"locked"} ${th.dark?"dark":""}" style="${themeVars(th)}" data-t="${i}" ${open?"":"aria-disabled=true"}>
      ${mini(th)}<span class="num">${i+1}</span><h3>${esc(t.title)}</h3>
      <span class="dots">${t.levels.map((_,l)=>`<i class="s${stars(i,l)}"></i>`).join("")}</span></button>`}).join("")}</main>`;
  bindHeader();
  app.querySelectorAll(".house").forEach(b=>b.onclick=()=>{const t=+b.dataset.t;if(topicOpen(t))go({name:"topic",t})});
}

function topic(){
  const t=DATA[view.t],th=THEMES[view.t];
  app.innerHTML=header()+`<div class="bar"><button class="btn" id="back">← ყველა კარი</button></div>
  <section class="chunk intro"><span class="tag">კარი ${view.t+1}</span><h2>${esc(t.title)}</h2>
  <p>${esc(t.explain)}</p><div class="example">მაგალითი: ${esc(t.example)}</div></section>
  <div class="lvgrid">${t.levels.map((L,l)=>{const o=levelOpen(view.t,l),s=stars(view.t,l);
    return `<button class="chunk lv ${o?"":"locked"}" data-l="${l}"><span class="row1"><b>${l+1}</b><span class="st">${o?(s?starStr(s):""):"🔒"}</span></span>
      <span class="note">${esc(L.n)}</span>${L.uses.length?`<span class="uses">+ ${esc(L.uses.join(", "))}</span>`:""}${L.sols.length>1?`<span class="many">${L.sols.length} სწორი კოდი</span>`:""}</button>`}).join("")}</div>`;
  bindHeader();
  document.getElementById("back").onclick=()=>go({name:"home"});
  app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{const l=+b.dataset.l;if(levelOpen(view.t,l))startLevel(view.t,l)});
}

function startLevel(t,l){go({name:"play",t,l,code:[null,null,null,null],sel:0,tries:0,hints:0,locked:[false,false,false,false],fails:[],checked:[],won:false,msg:""})}

function play(){
  const T=DATA[view.t],L=T.levels[view.l],th=THEMES[view.t],auto=isAuto(view.t);
  if(auto)view.checked=autoTicks();
  app.innerHTML=`<div class="bar"><button class="btn" id="back">← ${esc(T.title)}</button>
   <div class="where">საკეტი ${view.l+1} / ${T.levels.length}<small>კარი ${view.t+1}: ${esc(T.title)}</small></div>
   <span class="notechip">${esc(L.n)}</span>${L.uses.length?`<span class="useschip">+ ნასწავლი: ${esc(L.uses.join(", "))}</span>`:""}<span class="sp"></span><span class="starsTotal">★ ${totalStars()}</span></div>
  <div class="play">
   <section class="clues" aria-label="პირობები">
     <details class="recall"><summary>💡 გაიხსენე: ${esc(T.new)}</summary><p>${esc(T.explain)}</p></details>
     ${L.s?`<div class="chunk story"><b>ამბავი</b>${esc(L.s)}</div>`:""}
     ${L.c.map((c,i)=>{const f=view.fails.includes(i);return `<button class="clue ${view.checked[i]&&!f?"done":""} ${f?"fail":""} ${auto?"auto":""}" data-i="${i}" ${auto?'aria-disabled="true"':`aria-pressed="${!!view.checked[i]}"`}>${f?'<span class="failtag">არ სრულდება</span>':""}<span class="box">${view.checked[i]&&!f?"✓":""}</span><span class="tx">${markup(c)}</span></button>`}).join("")}
     <p class="tip">${L.sols.length>1?"ამ კარს რამდენიმე კოდი აღებს, იპოვე ერთი მაინც! ":""}${auto?"შესრულებული პირობა თავისით მოინიშნება ✓":"დააჭირე პირობას, როცა გამოიყენებ, და ის მოინიშნება ✓"}</p>
   </section>
   <section>
     <div class="scene shape-${th.shape} tex-${th.tex} ${th.openX?"open-x":""} ${view.won?"open":""}" id="scene" style="${themeVars(th)}">
       <span class="sign">${esc(th.name)}</span>
       <div class="frame">
         <div class="doorway">${view.won?winHTML(th):""}</div>
         <div class="leaf"><span class="knob" aria-hidden="true"></span>
           <div class="plate" role="group" aria-label="საკეტი">${[0,1,2,3].map(i=>`<div class="slot ${view.sel===i?"sel":""}">
             <button class="arr" data-up="${i}" aria-label="${POS[i]} ციფრი, ერთით მეტი">▲</button>
             <div class="win ${view.code[i]===null?"empty":""} ${view.locked[i]?"lockd":""}" data-w="${i}" tabindex="0" role="button" aria-label="${POS[i]} ციფრი">${view.code[i]===null?"?":view.code[i]}</div>
             <button class="arr" data-dn="${i}" aria-label="${POS[i]} ციფრი, ერთით ნაკლები">▼</button></div>`).join("")}</div>
         </div>
       </div>
     </div>
     <div class="panel">${view.won?"":`
       <div class="msg" role="status">${esc(view.msg||"")}</div>
       <div class="acts"><button class="btn go open" id="open">🔑 გააღე</button><button class="btn" id="hint">მინიშნება</button></div>
       <div class="meta"><span>ცდები: ${view.tries}</span><span>${view.hints?`მინიშნება: ${view.hints}`:"ციფრების ჩაწერა კლავიატურითაც შეიძლება"}</span></div>`}</div>
   </section>
  </div>`;
  document.getElementById("back").onclick=()=>go({name:"topic",t:view.t});
  if(!auto)app.querySelectorAll(".clue").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;view.checked[i]=!view.checked[i];play()});
  app.querySelectorAll("[data-w]").forEach(w=>w.onclick=()=>{view.sel=+w.dataset.w;play()});
  app.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>spin(+b.dataset.up,1));
  app.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>spin(+b.dataset.dn,-1));
  if(view.won){const nx=document.getElementById("next");if(nx)nx.onclick=nextLevel;const th2=document.getElementById("toHome");if(th2)th2.onclick=()=>go({name:"home"});document.getElementById("again").onclick=()=>startLevel(view.t,view.l)}
  else{document.getElementById("open").onclick=check;document.getElementById("hint").onclick=hint}
}
function winHTML(th){
  const L=DATA[view.t].levels[view.l],mine=view.code.join(""),others=L.sols.filter(s=>s!==mine);
  const nmax=th.shape==="round"?4:6;
  const nx=nextRef(),nth=nx?THEMES[nx.t]:null;
  return `<span class="prize" aria-hidden="true">${th.prize}</span>
  <div class="wstars" aria-label="${view.earned} ვარსკვლავი">${starStr(view.earned)}</div>
  <h3>კარი გაიღო!</h3><div class="code">${mine}</div>
  ${others.length?`<div class="others">კიდევ ${others.length} კოდი აღებს:</div><div class="chips">${others.slice(0,nmax).map(s=>`<span>${s}</span>`).join("")}${others.length>nmax?`<span>+${others.length-nmax}</span>`:""}</div>`:`<div class="others">სხვა კოდი ამ კარს ვერ აღებს</div>`}
  ${nx?`<button class="nextdoor" id="next">${mini(nth)}შემდეგი კარი →</button>`:`<button class="nextdoor" id="toHome">ყველა კარი გაიღო! 🏆</button>`}
  <button class="again" id="again">თავიდან ვცდი</button>`;
}
function nextRef(){if(view.l+1<DATA[view.t].levels.length)return{t:view.t,l:view.l+1};if(view.t+1<DATA.length)return{t:view.t+1,l:0};return null}
function nextLevel(){const n=nextRef();if(!n)return go({name:"home"});if(n.t!==view.t)go({name:"topic",t:n.t});else startLevel(n.t,n.l)}
function spin(i,dir){if(view.won||view.locked[i])return;const v=view.code[i];view.code[i]=v===null?(dir>0?0:9):(v+dir+10)%10;view.sel=i;view.fails=[];view.msg="";play()}
function typeD(d){
  if(view.won)return;
  if(d==="x"){let i=view.sel;if(view.code[i]===null&&i>0)i--;if(!view.locked[i]){view.code[i]=null;view.sel=i}}
  else{const i=view.sel;if(!view.locked[i])view.code[i]=+d;let j=i;do{j++}while(j<4&&view.locked[j]);view.sel=j<4?j:i}
  view.fails=[];view.msg="";play();
}
function check(){
  if(view.won)return;
  if(view.code.some(x=>x===null)){view.msg="ჯერ ოთხივე ციფრი ჩაწერე";play();return}
  const f=preds(view.t,view.l).map((p,i)=>p(...view.code,odd,ev,UP,pairEq)?-1:i).filter(i=>i>=0);
  if(!f.length){
    view.earned=Math.max(1,3-(view.tries>=1?1:0)-(view.tries>=3?1:0)-view.hints);
    view.won=true;const k=key(view.t,view.l);S.progress[k]=Math.max(S.progress[k]||0,view.earned);save();play();
    requestAnimationFrame(()=>{const n=document.getElementById("next")||document.getElementById("again");n&&n.focus()});return;
  }
  view.tries++;view.fails=f;
  view.msg=f.length===1?"ერთი პირობა არ სრულდება, ის წითლადაა მონიშნული":`${f.length} პირობა არ სრულდება, ისინი წითლადაა მონიშნული`;
  play();const s=document.getElementById("scene");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake");
}
function hint(){
  if(view.won)return;
  const L=DATA[view.t].levels[view.l];
  const fits=s=>view.locked.every((lk,i)=>!lk||+s[i]===view.code[i]);
  const score=s=>s.split("").reduce((a,ch,i)=>a+(view.code[i]===+ch?1:0),0);
  const best=L.sols.filter(fits).sort((x,y)=>score(y)-score(x))[0];
  if(!best){view.msg="მინიშნება აქ ვერ დაგეხმარება";play();return}
  const i=[0,1,2,3].find(i=>!view.locked[i]&&view.code[i]!==+best[i]);
  if(i===undefined){view.msg="ეს კოდი უკვე სწორია, დააჭირე „გააღე“-ს";play();return}
  view.code[i]=+best[i];view.locked[i]=true;view.hints++;view.fails=[];
  view.msg=`მინიშნება: ${POS[i]} ციფრი შეიძლება იყოს ${best[i]}`;
  let j=0;while(j<4&&(view.locked[j]||view.code[j]!==null))j++;view.sel=j<4?j:view.sel;play();
}
document.addEventListener("keydown",e=>{
  if(view.name!=="play"||view.won)return;
  if(/^[0-9]$/.test(e.key)){typeD(e.key);e.preventDefault()}
  else if(e.key==="Backspace"){typeD("x");e.preventDefault()}
  else if(e.key==="Enter"&&e.target.tagName!=="BUTTON"){check();e.preventDefault()}
  else if(e.key==="ArrowLeft"){view.sel=Math.max(0,view.sel-1);play()}
  else if(e.key==="ArrowRight"){view.sel=Math.min(3,view.sel+1);play()}
  else if(e.key==="ArrowUp"){spin(view.sel,1);e.preventDefault()}
  else if(e.key==="ArrowDown"){spin(view.sel,-1);e.preventDefault()}
});
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){view.name==="home"?home():view.name==="topic"?topic():play()}
function start(d){if(d&&d.view&&d.view.name!=="play")view=d.view;render()}
window.claude?.hot?.snapshot?.(()=>({view}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
</html>
